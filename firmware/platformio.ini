; Elevator display — CAN bus + MQTT / Home Assistant
; Board: ESP32-3248S035R (ESP32-WROOM-32, ST7796 480x320, XPT2046 resistive touch)
; CAN:   built-in TWAI controller + 3.3 V transceiver on P3: TX = GPIO 22, RX = GPIO 35

[env:lift]
platform         = espressif32
board            = esp32dev
framework        = arduino
monitor_speed    = 115200
upload_speed     = 921600
upload_port      = COM8
monitor_port     = COM8
monitor_filters  = esp32_exception_decoder
; Same layout as esp32Fire on purpose: flashing over the fire panel needs no
; erase, and the touch calibration in NVS ("touch" namespace) survives.
board_build.partitions = partitions_elevator.csv

lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    lvgl/lvgl @ 8.4.0

build_flags =
    ; ---------- LVGL ----------
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    ; ---------- TFT_eSPI configured here, User_Setup.h untouched ----------
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=33
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=16000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D USE_HSPI_PORT=1
    ; ---------- General ----------
    -D CORE_DEBUG_LEVEL=1
    -std=gnu++17
build_unflags = -std=gnu++11

; Network upload (ArduinoOTA / espota) to a board already running this firmware:
;   pio run -e lift_ota -t upload
; The OTA password is the panel's technician code — put it in upload_flags.
[env:lift_ota]
extends          = env:lift
upload_protocol  = espota
upload_port      = 192.168.31.16
upload_flags     = --auth=CHANGE_TO_TECHNICIAN_CODE
